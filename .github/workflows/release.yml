name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, e.g. 0.4.0 (no leading v). Builds the zips as a workflow artifact without publishing a release.'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Work out version
        id: version
        shell: pwsh
        run: |
          $v = if ('${{ github.event_name }}' -eq 'push') { '${{ github.ref_name }}'.TrimStart('v') } else { '${{ inputs.version }}' }
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Version '$v' must look like 1.2.3" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Test
        run: dotnet test --configuration Release

      - name: Package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./build/package.ps1 -Version ${{ steps.version.outputs.version }}

      - uses: actions/upload-artifact@v4
        with:
          name: twitch-vod-downloader-${{ steps.version.outputs.version }}
          path: artifacts/*.zip

      - name: Publish GitHub release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zips = (Get-ChildItem artifacts -Filter *.zip).FullName
          # The tag may come from a release drafted on GitHub; if so, attach to it instead of creating one.
          gh release view '${{ github.ref_name }}' *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload '${{ github.ref_name }}' @zips --clobber
          } else {
            gh release create '${{ github.ref_name }}' @zips --title 'Twitch VOD Downloader ${{ github.ref_name }}' --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
